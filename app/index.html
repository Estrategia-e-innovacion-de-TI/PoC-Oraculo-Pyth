<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PoC Oráculo · Bóveda tokenizada</title>
  <style>
    :root {
      --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f0f3f7; --border: #dde3ea;
      --text: #14202e; --muted: #5d6b7c; --accent: #1f5fbf; --accent-text: #ffffff;
      --ok: #137a43; --ok-bg: #e3f4ea; --warn: #8a5a00; --warn-bg: #fdf1d8; --bad: #b42318; --bad-bg: #fde7e5;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e141b; --surface: #16202b; --surface-2: #1d2936; --border: #2a3846;
        --text: #e6edf4; --muted: #9aa8b7; --accent: #5b9bff; --accent-text: #0b1420;
        --ok: #5fd394; --ok-bg: #143323; --warn: #f3c25b; --warn-bg: #3a2c0c; --bad: #ff8a80; --bad-bg: #3d1714;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
    header h1 { font-size: 18px; margin: 0; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card h2 { margin: 0; font-size: 17px; }
    .card .sub { color: var(--muted); font-size: 13px; margin: 2px 0 16px; }
    section + section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
    h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .ok { background: var(--ok-bg); color: var(--ok); } .warn { background: var(--warn-bg); color: var(--warn); }
    .bad { background: var(--bad-bg); color: var(--bad); }
    .explain { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    input[type=number] { width: 120px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text); font: inherit; }
    button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
      color: var(--text); font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.on { outline: 2px solid var(--warn); }
    .admin { border: 1px dashed var(--border); border-radius: 8px; padding: 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    #log { font-family: var(--mono); font-size: 12px; max-height: 260px; overflow: auto; }
    #log div { padding: 6px 0; border-bottom: 1px solid var(--border); }
    #log .err { color: var(--bad); } #log .okl { color: var(--ok); }
    #banner { display: none; margin-bottom: 20px; }
    .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>PoC Oráculo · Bóveda tokenizada</h1>
      <p>Precio de un activo vía oráculo → valor de la participación · red local (copia de Base Sepolia)</p>
    </div>
    <div class="row" style="margin:0">
      <span id="account" class="muted">Sin conectar</span>
      <button id="connect" class="primary">Conectar MetaMask</button>
    </div>
  </header>

  <main>
    <div id="banner" class="card explain"></div>
    <div id="vaults" class="grid"></div>

    <div class="card" style="margin-top:20px">
      <h3>Actividad</h3>
      <div id="log"><div class="muted">Las transacciones aparecerán aquí.</div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
